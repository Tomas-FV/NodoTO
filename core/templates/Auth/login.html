{% extends 'base.html' %}
{% load static %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-panel">
        <div class="auth-brand">
            <img src="{% static 'img/LogoNodoTO.png' %}" alt="NodoTO" loading="lazy">
            <span>NodoTO</span>
        </div>
        <span class="auth-eyebrow">Espacio clínico</span>
        <h1>Iniciar sesión</h1>
        <p class="auth-intro">Accede a tu espacio de trabajo clínico.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="username">Usuario</label>
                <input class="form-control auth-input" type="text" id="username" name="username" autocomplete="username" placeholder="Ingresa tu usuario" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-control auth-input" type="password" id="password" name="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required>
            </div>
            <button class="btn btn-primary auth-submit w-100" type="submit">Iniciar sesión</button>
        </form>
        <p class="auth-register small mb-0">¿Aún no tienes una cuenta? <a href="{% url 'register' %}">Crear cuenta</a></p>
    </div>
</div>
{% endblock %}
