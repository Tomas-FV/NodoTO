<!DOCTYPE html>
<html>
{% load static %}

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>{% block title %} --- {% endblock %}</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- CSS -->
    <link rel="stylesheet" type="text/css" media="screen" href="{% static 'css/style.css' %}">

</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">

            <!-- Logo (siempre visible) -->
            <a class="navbar-brand" href="{% url 'home' %}">
                <img src="{% static 'img/LogoNodoTO.png' %}" alt="NodoTO" loading="lazy" />
            </a>

            <!-- Botón hamburguesa (Bootstrap 5) -->
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false"
                aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Contenido colapsable -->
            <div class="collapse navbar-collapse" id="navbarContent">
                <!-- Links izquierda -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'pautas' %}">Pautas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" tabindex="-1" aria-disabled="true" href="#">Usuarios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" tabindex="-1" aria-disabled="true" href="#">Reportes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'sobrenodoto' %}">Sobre NodoTO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" tabindex="-1" aria-disabled="true" href="#">¡¡Pronto más!!</a>
                    </li>
                </ul>

                <!-- Elementos derecha -->
                <div class="d-flex align-items-center gap-3">
                    <!-- Notificaciones -->
                    <!-- <div class="dropdown">
                        <a class="link-secondary dropdown-toggle" href="#"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-bell"></i>
                            <span class="badge rounded-pill bg-danger">1</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">Sin notificaciones</a></li>
                        </ul>
                    </div> -->
                    <!-- Avatar -->
                    <!-- <div class="dropdown">
                        <a class="dropdown-toggle d-flex align-items-center link-secondary" href="#"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="https://mdbcdn.b-cdn.net/img/new/avatars/2.webp"
                                class="rounded-circle" height="30" alt="Avatar" loading="lazy" />
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">Mi perfil</a></li>
                            <li><a class="dropdown-item" href="#">Configuración</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Cerrar sesión</a></li>
                        </ul>
                    </div> -->
                </div>
            </div>
        </div>
    </nav>
    <main>
        {% block content %}

        {% endblock %}
    </main>

    {% if messages %}
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;">
        {% for message in messages %}
        <div class="toast align-items-center border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="4200">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2" style="background: #edf8f0; color: #1d4d36; border-radius: 12px;">
                    <span class="fw-bold" style="font-size: 1.1rem;">✓</span>
                    <span>{{ message }}</span>
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <script>
        document.querySelectorAll('.toast').forEach((toastEl) => {
            const toast = new bootstrap.Toast(toastEl, { delay: 4200 });
            toast.show();
        });
    </script>

    <footer class="text-center bg-body-tertiary">
        <!-- Grid container -->
        <div class="container pt-4">
            <!-- Section: Social media -->
            <section class="mb-4">

                <!-- Google -->
                <a data-mdb-ripple-init class="btn btn-link btn-floating btn-lg text-body m-1" href="#!" role="button"
                    data-mdb-ripple-color="dark"><i class="fab fa-google"></i></a>

                <!-- Instagram -->
                <a data-mdb-ripple-init class="btn btn-link btn-floating btn-lg text-body m-1" href="#!" role="button"
                    data-mdb-ripple-color="dark"><i class="fab fa-instagram"></i></a>
            </section>
            <!-- Section: Social media -->
        </div>
        <!-- Grid container -->

        <!-- Copyright -->
        <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.05);">
            © 2026 Copyright
        </div>
        <!-- Copyright -->
    </footer>
</body>

</html>
